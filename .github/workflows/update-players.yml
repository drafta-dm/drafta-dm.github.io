name: Update Players Database

on:
  schedule:
    # Ogni giorno alle 07:00 UTC (09:00 ora italiana)
    - cron: "0 7 * * *"
  # Permette di lanciare il workflow manualmente da GitHub
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze Python
        run: |
          pip install requests openpyxl

      - name: Download Excel da Fantacalcio.it
        env:
          FANTACALCIO_USERNAME: ${{ secrets.FANTACALCIO_USERNAME }}
          FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
        run: |
          python -u scripts/download_excel.py

      - name: Verifica che il file Excel sia stato scaricato
        run: |
          if [ -f "scripts/Quotazioni_Fantacalcio_Stagione_2025_26.xlsx" ]; then
            echo "✅ File Excel trovato"
            ls -lh scripts/Quotazioni_Fantacalcio_Stagione_2025_26.xlsx
          else
            echo "❌ File Excel NON trovato - il download è fallito"
            exit 1
          fi

      - name: Converti Excel in JS
        run: |
          python -u scripts/convert_excel_to_js.py

      - name: Commit e push di players.js aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data/players.js
          git diff --cached --quiet || git commit -m "chore: aggiornamento automatico players.js [$(date +'%Y-%m-%d')]"
          git push
