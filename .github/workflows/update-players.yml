name: Update players

on:
  schedule:
    - cron: "0 7 * * *"   # every day, 09:00 in Italy (08:00 in winter)
  workflow_dispatch:

jobs:
  update-players:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push js/data/players.js

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl

      - name: Download the price list of the current season
        env:
          FANTACALCIO_USERNAME: ${{ secrets.FANTACALCIO_USERNAME }}
          FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
        run: python -u scripts/download_excel.py

      - name: Convert to js/data/players.js
        run: python -u scripts/convert_excel_to_js.py

      - name: Commit only when the players changed, not just the date
        run: |
          if git diff --quiet -I'playersLastUpdated' -- js/data/players.js; then
            echo "No changes in the price list."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data/players.js
          git commit -m "Players and prices updated from Fantacalcio.it ($(date +'%Y-%m-%d'))"
          git push
