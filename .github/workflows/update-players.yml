name: Update Players Database

on:
  schedule:
    # Ogni giorno alle 07:00 UTC (09:00 ora italiana)
    - cron: "0 7 * * *"
  # Permette di lanciare il workflow manualmente da GitHub
  workflow_dispatch:

jobs:
  update-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          # Token con permessi di scrittura per fare il commit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze Python
        run: |
          pip install playwright openpyxl

      - name: Installa Chromium (Playwright)
        run: playwright install chromium --with-deps

      - name: Download Excel e conversione in JS
        env:
          FANTACALCIO_USERNAME: ${{ secrets.FANTACALCIO_USERNAME }}
          FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
        run: |
          python scripts/download_excel.py
          python scripts/convert_excel_to_js.py

      - name: Commit e push di players.js aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data/players.js
          # Esegue il commit solo se c'è qualcosa di nuovo da committare
          git diff --cached --quiet || git commit -m "chore: aggiornamento automatico players.js [$(date +'%Y-%m-%d')]"
          git push
